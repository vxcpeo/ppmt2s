<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1500 500" role="img" aria-labelledby="title desc">
  <title id="title">Keepora X banner</title>
  <desc id="desc">The Keepora X header banner: the pink bubble mark, the keepora.xyz wordmark and the line Real collectibles, on-chain proof, with escrow, Item NFT and Trade Proof pills.</desc>
  <defs>
    <radialGradient id="glowA" cx="0.12" cy="0.02" r="0.72">
      <stop offset="0" stop-color="#FFD7E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD7E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.96" cy="0.98" r="0.72">
      <stop offset="0" stop-color="#FFE9D6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFE9D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6FB5"/>
      <stop offset="0.55" stop-color="#E6006F"/>
      <stop offset="1" stop-color="#A80050"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9CC6"/>
      <stop offset="1" stop-color="#E6006F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#140A19" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1500" height="500" fill="#FFFFFF"/>
  <rect width="1500" height="500" fill="url(#glowA)"/>
  <rect width="1500" height="500" fill="url(#glowB)"/>
<g transform="translate(420,108) scale(0.15)">  <rect x="72.00" y="72.00" width="656.00" height="656.00" rx="157.44" fill="url(#pinkGrad)"/>
  <circle cx="583.68" cy="229.44" r="39.36" fill="#ffffff" opacity="0.85"/>
  <text x="400.00" y="504.96" text-anchor="middle" font-family="Segoe UI, Arial, Helvetica, sans-serif" font-size="341.12" font-weight="700" fill="#ffffff">K</text></g>
<text x="560" y="186" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="52" font-weight="700" text-anchor="start" letter-spacing="-1.8" opacity="1.0">keepora</text>
<text x="562" y="216" fill="#6D6A70" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="13" font-weight="600" text-anchor="start" letter-spacing="3.6" opacity="1.0">COLLECT WITH CONTEXT.</text>
<text x="420" y="302" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="44" font-weight="700" text-anchor="start" letter-spacing="-1.4" opacity="1.0">Real collectibles. On-chain proof.</text>
<rect x="450" y="330" width="168" height="44" rx="22.0" fill="#FFF5F9" stroke="#F7D7E5" stroke-width="2" opacity="1.0"/><text x="534.0" y="357.04" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.4" opacity="1.0">ESCROW</text>
<rect x="634" y="330" width="196" height="44" rx="22.0" fill="#FFF5F9" stroke="#F7D7E5" stroke-width="2" opacity="1.0"/><text x="732.0" y="357.04" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.4" opacity="1.0">ITEM NFT</text>
<rect x="846" y="330" width="248" height="44" rx="22.0" fill="#FFF5F9" stroke="#F7D7E5" stroke-width="2" opacity="1.0"/><text x="970.0" y="357.04" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="14" font-weight="700" text-anchor="middle" letter-spacing="1.4" opacity="1.0">TRADE PROOF</text>
<circle cx="240" cy="120" r="120" fill="none" stroke="#F7D7E5" stroke-width="2.5" opacity="0.5"/>
<circle cx="1300" cy="380" r="150" fill="none" stroke="#F7D7E5" stroke-width="2.5" opacity="0.45"/>
