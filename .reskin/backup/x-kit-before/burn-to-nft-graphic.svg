<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Keepora burn-to-NFT flow</title>
  <desc id="desc">A seven-step Keepora flow diagram: buyer pays TRF, funds enter escrow, seller submits a continuous destruction video and raw metadata, an evidence hash is recorded and an administrator reviews it, an Item NFT is minted into escrow, a 48 to 72 hour dispute window runs, and the Item NFT plus Trade Proof NFTs are released after no dispute. A failed review results in no mint.</desc>
  <defs>
    <radialGradient id="glowA" cx="0.12" cy="0.02" r="0.72">
      <stop offset="0" stop-color="#FFD7E8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD7E8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowB" cx="0.96" cy="0.98" r="0.72">
      <stop offset="0" stop-color="#FFE9D6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#FFE9D6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pinkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FF6FB5"/>
      <stop offset="0.55" stop-color="#E6006F"/>
      <stop offset="1" stop-color="#A80050"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF9CC6"/>
      <stop offset="1" stop-color="#E6006F"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#140A19" flood-opacity="0.07"/>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <rect width="1600" height="900" fill="url(#glowA)"/>
  <rect width="1600" height="900" fill="url(#glowB)"/>
<rect x="96" y="98" width="46" height="4" rx="2" fill="#E6006F"/><text x="156" y="108" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="17" font-weight="700" text-anchor="start" letter-spacing="4" opacity="1.0">KEEPORA / ITEM NFT FLOW 002</text>
<text x="96" y="200" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="62" font-weight="700" text-anchor="start" letter-spacing="-2" opacity="1.0">From token trade</text>
<text x="96" y="268" fill="#C2005D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="62" font-weight="700" text-anchor="start" letter-spacing="-2" opacity="1.0">to Item NFT.</text>
<text x="96" y="316" fill="#6D6A70" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="400" text-anchor="start" opacity="1.0">Every step is recorded, reviewed and signed before a mint.</text>
<g filter="url(#soft)"><rect x="96" y="356" width="872" height="460" rx="36" fill="#FFFFFF" stroke="#E9E4EB" stroke-width="2.5" opacity="1.0"/></g>
<circle cx="146" cy="424" r="21" fill="#FFF5F9" stroke="#F7D7E5" stroke-width="2"/>
<text x="146" y="430" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.6" opacity="1.0">01</text>
<text x="190" y="420" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="-0.6" opacity="1.0">Buyer pays</text>
<text x="190" y="444" fill="#6D6A70" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" opacity="1.0">Payment moves in TRF.</text>
<line x1="146" y1="448" x2="146" y2="458" stroke="#F7D7E5" stroke-width="2.5"/>
<circle cx="146" cy="480" r="21" fill="#FFF5F9" stroke="#F7D7E5" stroke-width="2"/>
<text x="146" y="486" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.6" opacity="1.0">02</text>
<text x="190" y="476" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="-0.6" opacity="1.0">Funds enter escrow</text>
<text x="190" y="500" fill="#6D6A70" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" opacity="1.0">The order holds the payment.</text>
<line x1="146" y1="504" x2="146" y2="514" stroke="#F7D7E5" stroke-width="2.5"/>
<circle cx="146" cy="536" r="21" fill="#FFF5F9" stroke="#F7D7E5" stroke-width="2"/>
<text x="146" y="542" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.6" opacity="1.0">03</text>
<text x="190" y="532" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="-0.6" opacity="1.0">Seller submits video</text>
<text x="190" y="556" fill="#6D6A70" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" opacity="1.0">Continuous destruction plus raw metadata.</text>
<line x1="146" y1="560" x2="146" y2="570" stroke="#F7D7E5" stroke-width="2.5"/>
<circle cx="146" cy="592" r="21" fill="#FFF5F9" stroke="#F7D7E5" stroke-width="2"/>
<text x="146" y="598" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.6" opacity="1.0">04</text>
<text x="190" y="588" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="-0.6" opacity="1.0">Evidence hash</text>
<text x="190" y="612" fill="#6D6A70" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" opacity="1.0">Hash and timestamp are recorded.</text>
<line x1="146" y1="616" x2="146" y2="626" stroke="#F7D7E5" stroke-width="2.5"/>
<circle cx="146" cy="648" r="21" fill="#FFF5F9" stroke="#F7D7E5" stroke-width="2"/>
<text x="146" y="654" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.6" opacity="1.0">05</text>
<text x="190" y="644" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="-0.6" opacity="1.0">Admin review</text>
<text x="190" y="668" fill="#6D6A70" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" opacity="1.0">An administrator verifies the evidence.</text>
<line x1="146" y1="672" x2="146" y2="682" stroke="#F7D7E5" stroke-width="2.5"/>
<circle cx="146" cy="704" r="21" fill="#FFF5F9" stroke="#F7D7E5" stroke-width="2"/>
<text x="146" y="710" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.6" opacity="1.0">06</text>
<text x="190" y="700" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="-0.6" opacity="1.0">Item NFT in escrow</text>
<text x="190" y="724" fill="#6D6A70" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" opacity="1.0">Minted into escrow, not the buyer yet.</text>
<line x1="146" y1="728" x2="146" y2="738" stroke="#F7D7E5" stroke-width="2.5"/>
<circle cx="146" cy="760" r="21" fill="#FFF5F9" stroke="#F7D7E5" stroke-width="2"/>
<text x="146" y="766" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.6" opacity="1.0">07</text>
<text x="190" y="756" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="22" font-weight="700" text-anchor="start" letter-spacing="-0.6" opacity="1.0">48–72h dispute window</text>
<text x="190" y="780" fill="#6D6A70" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="17" font-weight="400" text-anchor="start" opacity="1.0">No dispute, then release.</text>
<g filter="url(#soft)"><rect x="1000" y="356" width="504" height="234" rx="36" fill="#FFFFFF" stroke="#E9E4EB" stroke-width="2.5" opacity="1.0"/></g>
<rect x="1040" y="392" width="80" height="4" rx="2" fill="#E6006F"/>
<text x="1134" y="398" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="3.4" opacity="1.0">ON RELEASE</text>
<text x="1040" y="458" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" letter-spacing="-1.2" opacity="1.0">Item NFT +</text>
<text x="1040" y="498" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="32" font-weight="700" text-anchor="start" letter-spacing="-1.2" opacity="1.0">Trade Proof NFTs</text>
<text x="1040" y="536" fill="#6D6A70" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" opacity="1.0">Buyer gets the item; both sides get proof.</text>
<circle cx="1046" cy="564" r="7" fill="#E6006F"/>
<text x="1064" y="570" fill="#6D6A70" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" opacity="1.0">Two credentials per completed trade.</text>
<g filter="url(#soft)"><rect x="1000" y="614" width="504" height="202" rx="36" fill="#FFF5F9" stroke="#F7D7E5" stroke-width="2.5" opacity="1.0"/></g>
<text x="1040" y="660" fill="#C2005D" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="15" font-weight="700" text-anchor="start" letter-spacing="3.4" opacity="1.0">FAILED REVIEW</text>
<text x="1040" y="716" fill="#0D0D0D" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="27" font-weight="700" text-anchor="start" letter-spacing="-0.8" opacity="1.0">No approval, no Item NFT.</text>
<text x="1040" y="752" fill="#6D6A70" font-family="Avenir Next,Segoe UI,Arial,Helvetica,sans-serif" font-size="18" font-weight="400" text-anchor="start" opacity="1.0">Cancel, reject or default means no mint.</text>
<line x1="96" y1="840" x2="1504" y2="840" stroke="#E9E4EB" stroke-width="2"/><text x="96" y="876" fill="#6D6A70" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="14" font-weight="600" text-anchor="start" letter-spacing="3.2" opacity="1.0">TRF → ESCROW → EVIDENCE → REVIEW → ITEM NFT → RELEASE</text><text x="1504" y="876" fill="#6D6A70" font-family="Cascadia Mono,Consolas,SFMono-Regular,monospace" font-size="14" font-weight="600" text-anchor="end" letter-spacing="3.2" opacity="1.0">DRAFT PROTOCOL</text>
<circle cx="1530" cy="120" r="110" fill="none" stroke="#F7D7E5" stroke-width="2.5" opacity="0.5"/>
</svg>
