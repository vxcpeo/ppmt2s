<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Custoria launch graphic</title>
  <desc id="desc">A collectible moves through escrow to an Item NFT and Trade Proof NFT on Solana.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse">
      <path d="M44 0H0V44" fill="none" stroke="#19232D" stroke-width="1"/>
    </pattern>
    <linearGradient id="flow" x1="0" x2="1">
      <stop offset="0" stop-color="#55E6D6"/>
      <stop offset=".5" stop-color="#8A7CFF"/>
      <stop offset="1" stop-color="#B7F34B"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1600" height="900" fill="#0B0D12"/>
  <rect width="1600" height="900" fill="url(#grid)" opacity=".58"/>
  <text x="90" y="88" fill="#55E6D6" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">CUSTORIA  /  LAUNCH NOTE 001</text>
  <text x="90" y="156" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="750">REAL COLLECTIBLES.</text>
  <text x="90" y="222" fill="#B7F34B" font-family="Inter,Arial,sans-serif" font-size="62" font-weight="750">ON-CHAIN PROOF.</text>
  <text x="92" y="274" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="22" letter-spacing="1">A Solana marketplace for verified collectible resale.</text>

  <g transform="translate(92 380)">
    <text x="0" y="-34" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">01 / THE ITEM</text>
    <rect x="0" y="0" width="290" height="312" rx="18" fill="#111A23" stroke="#334551" stroke-width="3"/>
    <rect x="23" y="23" width="244" height="78" rx="10" fill="#1B2E35" stroke="#55E6D6" stroke-width="2"/>
    <text x="44" y="57" fill="#55E6D6" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">COLLECTIBLE</text>
    <text x="44" y="82" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">SERIES / 001</text>
    <path d="M92 267V166l52-38 54 38v101Z" fill="#8A7CFF" opacity=".78"/>
    <path d="M92 166h106M118 147l26-19 28 19" fill="none" stroke="#DAD6FF" stroke-width="6" stroke-linejoin="round"/>
    <circle cx="144" cy="201" r="24" fill="#FF6B4A"/>
    <circle cx="132" cy="194" r="4" fill="#0B0D12"/>
    <circle cx="156" cy="194" r="4" fill="#0B0D12"/>
    <path d="M133 211h22" stroke="#0B0D12" stroke-width="4" stroke-linecap="round"/>
    <text x="24" y="288" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="2">PHOTO + PROVENANCE</text>
  </g>

  <g transform="translate(426 502)">
    <path d="M0 28h524" stroke="url(#flow)" stroke-width="7" stroke-linecap="round" filter="url(#glow)"/>
    <circle cx="0" cy="28" r="13" fill="#55E6D6"/>
    <circle cx="260" cy="28" r="13" fill="#8A7CFF"/>
    <circle cx="524" cy="28" r="13" fill="#B7F34B"/>
    <path d="M150 15l18 13-18 13M412 15l18 13-18 13" fill="none" stroke="#DCE5ED" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="0" y="-20" fill="#DDFBF7" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">ESCROW</text>
    <text x="210" y="-20" fill="#F0EDFF" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">VERIFIED TRADE</text>
    <text x="474" y="-20" fill="#F1FFD0" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" letter-spacing="2">PROOF</text>
    <text x="0" y="78" fill="#6F7F8E" font-family="Inter,Arial,sans-serif" font-size="15">BUYER FUNDS LOCKED</text>
    <text x="211" y="78" fill="#6F7F8E" font-family="Inter,Arial,sans-serif" font-size="15">ORDER COMPLETE</text>
    <text x="467" y="78" fill="#6F7F8E" font-family="Inter,Arial,sans-serif" font-size="15">NFT RECORD</text>
  </g>

  <g transform="translate(1058 350)">
    <text x="0" y="-30" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" letter-spacing="3">02 / THE RECORD</text>
    <rect x="0" y="0" width="440" height="165" rx="16" fill="#14282D" stroke="#55E6D6" stroke-width="3"/>
    <rect x="22" y="22" width="66" height="66" rx="10" fill="#55E6D6"/>
    <path d="M37 53h36M55 35v36" stroke="#0B0D12" stroke-width="6" stroke-linecap="round"/>
    <text x="112" y="50" fill="#55E6D6" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">ITEM NFT</text>
    <text x="112" y="80" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Object provenance</text>
    <text x="112" y="112" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="15">Metadata / photos / transfer history</text>
    <text x="22" y="143" fill="#6F7F8E" font-family="Inter,Arial,sans-serif" font-size="13" letter-spacing="2">SOLANA / ITEM-001</text>

    <rect y="194" width="440" height="165" rx="16" fill="#242037" stroke="#8A7CFF" stroke-width="3"/>
    <rect x="22" y="216" width="66" height="66" rx="10" fill="#8A7CFF"/>
    <path d="M38 248h34M38 260h34M38 272h20" stroke="#0B0D12" stroke-width="6" stroke-linecap="round"/>
    <text x="112" y="244" fill="#BDAFFF" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" letter-spacing="3">TRADE PROOF NFT</text>
    <text x="112" y="274" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Completed trade</text>
    <text x="112" y="306" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="15">Buyer + seller reputation record</text>
    <text x="22" y="337" fill="#6F7F8E" font-family="Inter,Arial,sans-serif" font-size="13" letter-spacing="2">SOLANA / TRADE-001</text>
  </g>
  <text x="96" y="845" fill="#6F7F8E" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="2">TRF COORDINATES FEES, SELLER BONDS AND COMMUNITY GOVERNANCE.</text>
  <text x="1504" y="845" text-anchor="end" fill="#6F7F8E" font-family="Inter,Arial,sans-serif" font-size="15" letter-spacing="2">DRAFT PROTOCOL</text>
</svg>
