<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Custoria burn to NFT workflow</title>
  <desc id="desc">A seven-step flow from TRF payment and evidence review to Item NFT and Trade Proof NFTs.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#19232D" stroke-width="1"/></pattern>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#55E6D6"/><stop offset=".5" stop-color="#8A7CFF"/><stop offset="1" stop-color="#B7F34B"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="#0B0D12"/><rect width="1600" height="900" fill="url(#grid)" opacity=".58"/>
  <text x="84" y="76" fill="#55E6D6" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">CUSTORIA  /  PROOF FLOW 002</text>
  <text x="84" y="148" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="57" font-weight="750">FROM SALE TO PROOF.</text>
  <text x="84" y="198" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="21" letter-spacing="1">The physical item is destroyed first. The credential is minted only after evidence review.</text>
  <g transform="translate(84 254)">
    <g transform="translate(0 0)"><rect width="332" height="222" rx="16" fill="#111A23" stroke="#55E6D6" stroke-width="2"/><text x="24" y="38" fill="#55E6D6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3">01 / BUY</text><circle cx="67" cy="103" r="33" fill="#55E6D6"/><path d="M53 103h28M67 89v28" stroke="#0B0D12" stroke-width="6" stroke-linecap="round"/><text x="24" y="163" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Buyer pays in TRF</text><text x="24" y="193" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="15">Price + fee rules confirmed</text></g>
    <path d="M338 111h26" stroke="#55E6D6" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/><path d="M359 99l13 12-13 12" fill="none" stroke="#DCE5ED" stroke-width="4"/>
    <g transform="translate(374 0)"><rect width="332" height="222" rx="16" fill="#111A23" stroke="#55E6D6" stroke-width="2"/><text x="24" y="38" fill="#55E6D6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3">02 / LOCK</text><rect x="25" y="76" width="84" height="63" rx="10" fill="#163B3E" stroke="#55E6D6" stroke-width="2"/><rect x="48" y="101" width="38" height="28" rx="4" fill="none" stroke="#DDFBF7" stroke-width="4"/><path d="M57 101V90c0-14 20-14 20 0v11" fill="none" stroke="#DDFBF7" stroke-width="4"/><text x="24" y="163" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Funds enter escrow</text><text x="24" y="193" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="15">Seller bond stays locked</text></g>
    <path d="M712 111h26" stroke="#55E6D6" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/><path d="M733 99l13 12-13 12" fill="none" stroke="#DCE5ED" stroke-width="4"/>
    <g transform="translate(748 0)"><rect width="332" height="222" rx="16" fill="#111A23" stroke="#FF6B4A" stroke-width="2"/><text x="24" y="38" fill="#FF6B4A" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3">03 / BURN</text><rect x="24" y="76" width="91" height="62" rx="10" fill="#392322" stroke="#FF6B4A" stroke-width="2"/><circle cx="69" cy="106" r="18" fill="none" stroke="#FFE8E1" stroke-width="4"/><path d="M55 120l28-28M54 92l30 30" stroke="#FF6B4A" stroke-width="5" stroke-linecap="round"/><text x="24" y="163" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Seller records destruction</text><text x="24" y="193" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="15">Continuous video + raw metadata</text></g>
    <path d="M1086 111h26" stroke="#FF6B4A" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/><path d="M1107 99l13 12-13 12" fill="none" stroke="#DCE5ED" stroke-width="4"/>
    <g transform="translate(1122 0)"><rect width="310" height="222" rx="16" fill="#242037" stroke="#8A7CFF" stroke-width="2"/><text x="24" y="38" fill="#BDAFFF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3">04 / VERIFY</text><rect x="25" y="76" width="84" height="63" rx="10" fill="#352F57" stroke="#8A7CFF" stroke-width="2"/><path d="M48 108l13 13 27-31" fill="none" stroke="#F0EDFF" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><text x="24" y="163" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Hash + admin review</text><text x="24" y="193" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="15">Serial, video and burn result</text></g>

    <path d="M1277 256v62H166v62" fill="none" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/><path d="M152 369l12 15 12-15" fill="none" stroke="#DCE5ED" stroke-width="4"/>
    <g transform="translate(0 340)"><rect width="332" height="222" rx="16" fill="#122B31" stroke="#55E6D6" stroke-width="2"/><text x="24" y="38" fill="#55E6D6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3">05 / MINT</text><rect x="24" y="76" width="91" height="62" rx="10" fill="#55E6D6"/><path d="M47 108h45M69 86v44" stroke="#0B0D12" stroke-width="6" stroke-linecap="round"/><text x="24" y="163" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">Item NFT to escrow</text><text x="24" y="193" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="15">Metadata + evidence hash attached</text></g>
    <path d="M338 523h26" stroke="#55E6D6" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/><path d="M359 511l13 12-13 12" fill="none" stroke="#DCE5ED" stroke-width="4"/>
    <g transform="translate(374 340)"><rect width="332" height="222" rx="16" fill="#242037" stroke="#8A7CFF" stroke-width="2"/><text x="24" y="38" fill="#BDAFFF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3">06 / HOLD</text><circle cx="70" cy="107" r="32" fill="#352F57" stroke="#8A7CFF" stroke-width="2"/><path d="M70 88v21l14 9" fill="none" stroke="#F0EDFF" stroke-width="5" stroke-linecap="round"/><text x="24" y="163" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700">48-72h dispute window</text><text x="24" y="193" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="15">Funds, bond and NFT remain locked</text></g>
    <path d="M712 523h26" stroke="#8A7CFF" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/><path d="M733 511l13 12-13 12" fill="none" stroke="#DCE5ED" stroke-width="4"/>
    <g transform="translate(748 340)"><rect width="684" height="222" rx="16" fill="#253017" stroke="#B7F34B" stroke-width="2"/><text x="24" y="38" fill="#B7F34B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3">07 / RELEASE</text><rect x="24" y="76" width="91" height="62" rx="10" fill="#B7F34B"/><path d="M47 108h45M69 86v44" stroke="#111A0A" stroke-width="6" stroke-linecap="round"/><text x="141" y="105" fill="#F1FFD0" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700">Item NFT to buyer + Trade Proof NFTs</text><text x="141" y="137" fill="#B8C892" font-family="Inter,Arial,sans-serif" font-size="15">No dispute: seller funds and bond release; both sides receive a trade record.</text></g>
  </g>
  <rect x="84" y="836" width="1432" height="1" fill="#2A3540"/><text x="84" y="867" fill="#FF6B4A" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">FAILED REVIEW  -&gt;  NO ITEM NFT</text><text x="1516" y="867" text-anchor="end" fill="#6F7F8E" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="2">ITEM NFT = PRODUCT CREDENTIAL + TRADE HISTORY</text>
</svg>
