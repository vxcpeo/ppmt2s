<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Custoria verified trade flow</title>
  <desc id="desc">A five-step flow from listing and escrow to verified destruction evidence and permanent trade records.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#1B2428" stroke-width="1"/></pattern>
  </defs>
  <rect width="1600" height="900" fill="#0F1417"/>
  <rect width="1600" height="900" fill="url(#grid)"/>
  <text x="90" y="76" fill="#F5CB72" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" letter-spacing="5">CUSTORIA  /  VERIFIED TRADE FLOW</text>
  <text x="90" y="146" fill="#F7F3EB" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800">THE ITEM ENDS.</text>
  <text x="90" y="212" fill="#F5CB72" font-family="Inter,Arial,sans-serif" font-size="58" font-weight="800">THE PROOF REMAINS.</text>
  <text x="90" y="266" fill="#AAB9B4" font-family="Inter,Arial,sans-serif" font-size="21">TRF escrow + evidence review turns a completed physical trade into durable records.</text>
  <g font-family="Inter,Arial,sans-serif">
    <g transform="translate(70 360)"><rect width="214" height="232" rx="14" fill="#15252A" stroke="#36CBBF" stroke-width="3"/><text x="22" y="36" fill="#36CBBF" font-size="13" font-weight="800" letter-spacing="3">01 / LIST</text><rect x="24" y="61" width="166" height="74" rx="9" fill="#203940"/><path d="M58 113l48-35 48 35v20H58z" fill="#F5CB72"/><circle cx="106" cy="98" r="17" fill="#FF795C"/><text x="22" y="170" fill="#F7F3EB" font-size="17" font-weight="700">Seller lists item</text><text x="22" y="197" fill="#91B0AE" font-size="13">Quote set in TRF</text></g>
    <path d="M300 476h35" stroke="#F7F3EB" stroke-width="4"/><path d="M326 466l12 10-12 10" fill="none" stroke="#F7F3EB" stroke-width="4"/>
    <g transform="translate(350 360)"><rect width="214" height="232" rx="14" fill="#211E38" stroke="#8F82FF" stroke-width="3"/><text x="22" y="36" fill="#BEB6FF" font-size="13" font-weight="800" letter-spacing="3">02 / ESCROW</text><rect x="24" y="61" width="166" height="74" rx="9" fill="#2D294A"/><rect x="55" y="77" width="104" height="43" fill="none" stroke="#B5A7FF" stroke-width="6"/><path d="M78 76v-9h58v9" fill="none" stroke="#F7F3EB" stroke-width="4"/><path d="M88 98h42" stroke="#F7F3EB" stroke-width="4"/><text x="22" y="170" fill="#F7F3EB" font-size="17" font-weight="700">Buyer locks TRF</text><text x="22" y="197" fill="#BDB8D8" font-size="13">Funds + bond held</text></g>
    <path d="M580 476h35" stroke="#F7F3EB" stroke-width="4"/><path d="M606 466l12 10-12 10" fill="none" stroke="#F7F3EB" stroke-width="4"/>
    <g transform="translate(630 360)"><rect width="214" height="232" rx="14" fill="#30211E" stroke="#FF795C" stroke-width="3"/><text x="22" y="36" fill="#FF9A86" font-size="13" font-weight="800" letter-spacing="3">03 / DESTROY</text><rect x="24" y="61" width="166" height="74" rx="9" fill="#432922"/><path d="M75 76h64l-12 52H87z" fill="#FF795C"/><path d="M82 70h50M95 91v28M119 91v28" stroke="#F7F3EB" stroke-width="5"/><text x="22" y="170" fill="#F7F3EB" font-size="16" font-weight="700">Seller records evidence</text><text x="22" y="197" fill="#D9A29A" font-size="13">Continuous video proof</text></g>
    <path d="M860 476h35" stroke="#F7F3EB" stroke-width="4"/><path d="M886 466l12 10-12 10" fill="none" stroke="#F7F3EB" stroke-width="4"/>
    <g transform="translate(910 360)"><rect width="214" height="232" rx="14" fill="#15252A" stroke="#36CBBF" stroke-width="3"/><text x="22" y="36" fill="#36CBBF" font-size="13" font-weight="800" letter-spacing="3">04 / REVIEW</text><rect x="24" y="61" width="166" height="74" rx="9" fill="#203940"/><circle cx="107" cy="97" r="24" fill="#36CBBF"/><path d="M94 97l9 9 18-21" fill="none" stroke="#0F1417" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="M51 126h112" stroke="#F7F3EB" stroke-width="3"/><text x="22" y="170" fill="#F7F3EB" font-size="17" font-weight="700">Admin verifies proof</text><text x="22" y="197" fill="#91B0AE" font-size="13">Hash + signature recorded</text></g>
    <path d="M1140 476h35" stroke="#F7F3EB" stroke-width="4"/><path d="M1166 466l12 10-12 10" fill="none" stroke="#F7F3EB" stroke-width="4"/>
    <g transform="translate(1190 360)"><rect width="214" height="232" rx="14" fill="#243019" stroke="#F5CB72" stroke-width="3"/><text x="22" y="36" fill="#F5CB72" font-size="13" font-weight="800" letter-spacing="3">05 / MINT</text><rect x="24" y="61" width="166" height="74" rx="9" fill="#33451E"/><rect x="59" y="78" width="96" height="42" fill="none" stroke="#F5CB72" stroke-width="5"/><path d="M77 91h60M77 105h42" stroke="#F7F3EB" stroke-width="4" stroke-linecap="round"/><text x="22" y="170" fill="#F7F3EB" font-size="16" font-weight="700">NFT records are minted</text><text x="22" y="197" fill="#D5D3A0" font-size="13">Item + Trade Proof</text></g>
  </g>
  <rect x="90" y="680" width="690" height="105" rx="14" fill="#153338" stroke="#36CBBF" stroke-width="2"/><text x="116" y="724" fill="#36CBBF" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="3">ITEM NFT</text><text x="116" y="762" fill="#F7F3EB" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Object metadata, evidence hash, transfer history</text>
  <rect x="810" y="680" width="690" height="105" rx="14" fill="#25213E" stroke="#8F82FF" stroke-width="2"/><text x="836" y="724" fill="#BEB6FF" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="800" letter-spacing="3">TRADE PROOF NFT</text><text x="836" y="762" fill="#F7F3EB" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Completed trade record for buyer + seller</text>
  <text x="96" y="842" fill="#789391" font-family="Inter,Arial,sans-serif" font-size="13" letter-spacing="3">ITEM NFT MINTING REQUIRES VERIFIED DESTRUCTION EVIDENCE AND ADMIN APPROVAL.</text><text x="1342" y="842" fill="#789391" font-family="Inter,Arial,sans-serif" font-size="13" letter-spacing="3">DRAFT PROTOCOL</text>
</svg>
