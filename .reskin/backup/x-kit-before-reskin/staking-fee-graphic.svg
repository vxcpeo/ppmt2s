<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Custoria staking and fee-funded rewards</title>
  <desc id="desc">Token buy and sell fees and app fees flow into a reward pool distributed by staking weight.</desc>
  <defs>
    <pattern id="grid" width="44" height="44" patternUnits="userSpaceOnUse"><path d="M44 0H0V44" fill="none" stroke="#19232D" stroke-width="1"/></pattern>
    <linearGradient id="flow" x1="0" x2="1"><stop stop-color="#55E6D6"/><stop offset=".5" stop-color="#8A7CFF"/><stop offset="1" stop-color="#B7F34B"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="8" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1600" height="900" fill="#0B0D12"/><rect width="1600" height="900" fill="url(#grid)" opacity=".58"/>
  <text x="84" y="76" fill="#55E6D6" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" letter-spacing="5">CUSTORIA  /  REWARDS NOTE 003</text>
  <text x="84" y="148" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="57" font-weight="750">STAKE. WEIGHT. SHARE.</text>
  <text x="84" y="198" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="21" letter-spacing="1">Only realized token and app fees feed the proposed reward pool.</text>
  <g transform="translate(84 254)">
    <text x="0" y="0" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">REALIZED FEE SOURCES</text>
    <g transform="translate(0 28)"><rect width="346" height="150" rx="14" fill="#122B31" stroke="#55E6D6" stroke-width="2"/><text x="22" y="39" fill="#55E6D6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">RAIL 01</text><text x="22" y="83" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="750">Token fees</text><text x="22" y="119" fill="#B8DCD8" font-family="Inter,Arial,sans-serif" font-size="15">Buy + sell activity</text></g>
    <g transform="translate(0 198)"><rect width="346" height="150" rx="14" fill="#242037" stroke="#8A7CFF" stroke-width="2"/><text x="22" y="39" fill="#BDAFFF" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">RAIL 02</text><text x="22" y="83" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="26" font-weight="750">App fees</text><text x="22" y="119" fill="#C9C2F5" font-family="Inter,Arial,sans-serif" font-size="15">Marketplace activity</text></g>
    <path d="M370 104h80M370 274h80" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/><path d="M435 92l15 12-15 12M435 262l15 12-15 12" fill="none" stroke="#DCE5ED" stroke-width="4"/>
    <g transform="translate(474 54)"><rect width="416" height="424" rx="18" fill="#111A23" stroke="#55E6D6" stroke-width="2"/><text x="28" y="43" fill="#55E6D6" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="3">REWARD POOL / WEEKLY EPOCH</text><circle cx="207" cy="145" r="82" fill="#122B31" stroke="#55E6D6" stroke-width="4"/><circle cx="207" cy="145" r="57" fill="none" stroke="#B7F34B" stroke-width="8" stroke-dasharray="145 214" transform="rotate(-90 207 145)"/><text x="207" y="140" text-anchor="middle" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700">FEES IN</text><text x="207" y="168" text-anchor="middle" fill="#B7F34B" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700">REWARDS OUT</text><line x1="28" y1="246" x2="388" y2="246" stroke="#2C3B47"/><text x="28" y="286" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="15">User reward</text><text x="28" y="324" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750">pool x user weight</text><text x="28" y="357" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="24" font-weight="750">/ valid weight</text><text x="28" y="405" fill="#6F7F8E" font-family="Inter,Arial,sans-serif" font-size="14">Pool and claims are recorded by epoch</text></g>
    <path d="M918 264h76" stroke="url(#flow)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/><path d="M979 252l15 12-15 12" fill="none" stroke="#DCE5ED" stroke-width="4"/>
    <g transform="translate(1020 0)"><text x="0" y="0" fill="#9AA5B5" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" letter-spacing="3">USER WEIGHT</text><rect y="28" width="412" height="188" rx="16" fill="#242037" stroke="#8A7CFF" stroke-width="2"/><text x="24" y="65" fill="#F0EDFF" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="700">Locked TRF</text><text x="24" y="101" fill="#BDAFFF" font-family="Inter,Arial,sans-serif" font-size="17">x lock term</text><text x="24" y="137" fill="#BDAFFF" font-family="Inter,Arial,sans-serif" font-size="17">x membership NFT</text><text x="24" y="173" fill="#BDAFFF" font-family="Inter,Arial,sans-serif" font-size="17">x time-weight boost</text>
      <rect y="240" width="412" height="238" rx="16" fill="#111A23" stroke="#B7F34B" stroke-width="2"/><text x="24" y="278" fill="#B7F34B" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">MULTIPLIERS</text><text x="24" y="318" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="17">30d  1.00x</text><text x="174" y="318" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="17">90d  1.25x</text><text x="24" y="353" fill="#F2F4F8" font-family="Inter,Arial,sans-serif" font-size="17">180d 1.60x</text><line x1="24" y1="374" x2="388" y2="374" stroke="#2C3B47"/><text x="24" y="409" fill="#DDE6EC" font-family="Inter,Arial,sans-serif" font-size="16">Collector Pass  1.10x</text><text x="24" y="444" fill="#DDE6EC" font-family="Inter,Arial,sans-serif" font-size="16">Genesis Pass   1.25x</text></g>
  </g>
  <rect x="84" y="836" width="1432" height="1" fill="#2A3540"/><text x="84" y="867" fill="#FF6B4A" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="800" letter-spacing="2">REWARDS VARY WITH REAL FEE ACTIVITY</text><text x="1516" y="867" text-anchor="end" fill="#6F7F8E" font-family="Inter,Arial,sans-serif" font-size="14" letter-spacing="2">DRAFT PARAMS  /  NO FIXED APY OR PRICE PROMISE</text>
</svg>
